name = "uber-workload"
description = "Uber workload from Diablo (ramp-up profile)"

mode = "tps"
rate = 1
duration = 600
seed = 42

[setup]
scenarios = ["scenarios/uber.toml"]

[[stage]]
name = "ramp-1"
duration = 40
rate = 82
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0

# Stage 1: 40-75s @ 84.5 TPS
[[stage]]
name = "ramp-2"
duration = 35
rate = 85
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0

# Stage 2: 75-90s @ 89 TPS
[[stage]]
name = "peak-1"
duration = 15
rate = 89
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0

# Stage 3: 90-120s @ 90.5 TPS
[[stage]]
name = "peak-2"
duration = 30
rate = 91
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0

# Stage 4: 120-121s @ 85.5 TPS
[[stage]]
name = "cool-down"
duration = 1
rate = 86
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0

# Stage 5: 121s+ @ 0.5 TPS
[[stage]]
name = "end"
duration = 60
rate = 1
[[stage.mix]]
scenario = "scenarios/uber.toml"
share_pct = 100.0
